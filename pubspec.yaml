name: mappy
description: Offline geological field-mapping app — photos, descriptions, GPS pins, multi-project.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  path_provider: ^2.1.3

  # Map
  flutter_map: ^7.0.2
  flutter_map_tile_caching: ^10.0.0
  latlong2: ^0.9.1

  # Location / sensors
  geolocator: ^13.0.0
  flutter_compass: ^0.8.1

  # Camera + media
  camera: ^0.11.0+1
  flutter_image_compress: ^2.3.0
  native_exif: ^0.6.2
  image: ^4.2.0

  # Permissions
  permission_handler: ^11.3.1

  # Export / file IO
  archive: ^3.6.1
  csv: ^6.0.0
  share_plus: ^10.0.0

  # Persistence of small settings (active project id, last tile source, etc.)
  shared_preferences: ^2.2.3

  # Misc
  uuid: ^4.4.0
  intl: 0.20.2
  collection: ^1.18.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/splash/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#8A6A3F"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter_native_splash:
  color: "#F7F6F2"
  image: "assets/splash/splash_icon.png"
  android_12:
    color: "#F7F6F2"
    image: "assets/splash/splash_icon.png"
    icon_background_color: "#F7F6F2"
  android: true
  ios: false
  web: false
